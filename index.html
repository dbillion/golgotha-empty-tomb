<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c09">
<meta property="og:type" content="website">
<meta property="og:title" content="Israel Temple Places in 3D">
<meta property="og:description" content="Walk through the Tabernacle, Solomon's Temple and Herod's Temple in 3D, with weather, seasons and time of day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318120d'/%3E%3Cpath d='M12 50V28l20-14 20 14v22h-9V32L32 22 21 32v18z' fill='%23d9a84e'/%3E%3Crect x='28' y='36' width='8' height='14' fill='%23f2cf85'/%3E%3C/svg%3E">
<meta name="description" content="The Tabernacle, Solomon's Temple and Herod's Temple: three Blender-built scenes you can explore in 3D, with weather, season and time-of-day controls.">
<title>Israel Temple Places in 3D | Tabernacle, Solomon's Temple and Herod's Temple</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <main id="main">
    <div id="stage"></div>
    <video id="vid" controls loop muted playsinline></video>

    <header id="top">
      <h1>Israel Temple Places <span>in 3D</span></h1>
      <div class="group" id="scenes" role="group" aria-label="Scene">
        <button id="bTab" class="on">Tabernacle</button>
        <button id="bSol">Solomon's Temple</button>
        <button id="bHer">Herod's Temple</button>
      </div>
      <div class="group" role="group" aria-label="View mode">
        <button id="bV3" class="on">3D</button>
        <button id="bVV">Video</button>
      </div>
      <button id="bHud" class="on" aria-expanded="true" aria-controls="hud">Controls</button>
    </header>

    <div id="chip" aria-live="polite"></div>

    <footer id="foot">
      <button id="bPlay" aria-label="Play or pause">Pause</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Timeline">
      <span id="time">0.0 / 12.0 s</span>
    </footer>

    <div id="note" role="status"></div>
    <div id="load">Loading scene…</div>
  </main>

  <aside id="hud" aria-label="Environment controls">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Drag down to close controls"></div>
    <div class="hudhead"><strong>Environment</strong><button id="bReset" class="ghost">Reset all</button></div>

    <section>
      <h2>Weather</h2>
      <div class="chips" id="cWeather"></div>
    </section>
    <section>
      <h2>Season <small id="seasonHint"></small></h2>
      <div class="chips" id="cSeason"></div>
    </section>
    <section>
      <h2>Time of day <output id="todOut">as filmed</output></h2>
      <input id="tod" type="range" min="0" max="24" step="0.1" value="6" aria-label="Time of day">
      <div class="chips" id="cTod"></div>
    </section>
    <section>
      <h2>Display</h2>
      <div class="chips" id="cView"></div>
    </section>
    <section id="camSec">
      <h2>Camera</h2>
      <div class="chips" id="cCam"></div>
      <label class="row"><input type="checkbox" id="kAuto"> Slow auto-orbit</label>
    </section>
    <section>
      <h2>Scene</h2>
      <label class="row"><input type="checkbox" id="kClouds" checked> Clouds</label>
      <label class="row" id="rowRays"><input type="checkbox" id="kRays" checked> Ark light rays</label>
      <label class="row"><input type="checkbox" id="kSound"> Ambient sound (generated, no files)</label>
      <h2>Quality</h2>
      <div class="chips" id="cQual"></div>
    </section>
    <section class="actions">
      <button id="bShot">Save screenshot</button>
      <button id="bFull">Fullscreen</button>
      <button id="bLink">Copy link</button>
    </section>
    <p class="fine">Drag to look around, pinch or scroll to zoom. Keys: Space play/pause, H hide controls, F fullscreen.</p>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
